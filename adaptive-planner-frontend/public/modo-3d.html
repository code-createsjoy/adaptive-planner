<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Modo</title>
    <meta
      name="description"
      content="Explore the pink Modo device in 3D. Select a part to zoom in, orbit the model, and inspect its illuminated display and controls."
    />
    <meta name="application-name" content="Modo" />
    <meta name="theme-color" content="#ebe7e1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Modo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="canonical" href="https://modo-iota.vercel.app/" />
    <link rel="icon" href="/icon.png" type="image/png" sizes="1024x1024" />
    <link rel="apple-touch-icon" href="/icon.png" sizes="1024x1024" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Modo" />
    <meta property="og:title" content="Modo" />
    <meta
      property="og:description"
      content="Explore the pink Modo device in 3D. Select a part to zoom in, orbit the model, and inspect its illuminated display and controls."
    />
    <meta property="og:url" content="https://modo-iota.vercel.app/" />
    <meta property="og:image" content="https://modo-iota.vercel.app/icon.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="Modo" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Modo" />
    <meta
      name="twitter:description"
      content="Explore the pink Modo device in 3D. Select a part to zoom in, orbit the model, and inspect its illuminated display and controls."
    />
    <meta name="twitter:image" content="https://modo-iota.vercel.app/icon.png" />
    <meta name="twitter:image:alt" content="Modo" />
    <link rel="stylesheet" href="css/studio.css" />
  </head>
  <body>
    <main class="studio">
      <section class="stage" id="stage" aria-label="Interactive 3D product viewer">
        <div class="canvas-host" id="canvas-host"></div>
        <svg class="leader-lines" id="leader-lines" aria-hidden="true"></svg>
        <div class="labels" id="labels"></div>
        <div class="loading" id="loading" role="status">
          <div class="loading-card">
            <div class="loader-shape" aria-hidden="true"></div>
            <strong>Modo</strong>
            <p>Loading the model.</p>
          </div>
        </div>
      </section>

      <header class="bar">
        <div class="brand">
          <span class="brand-word">MODO</span>
        </div>
        <button
          class="menu-toggle"
          id="toggle-views"
          type="button"
          aria-expanded="false"
          aria-controls="view-menu"
          aria-label="Show views"
          data-close-label="Hide views"
        >
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m8 4 6 6-6 6" />
          </svg>
        </button>
        <div class="menu-reveal" id="view-menu">
          <nav class="views" aria-label="Camera views">
            <button data-view="hero" aria-pressed="true">Overview</button>
            <button data-view="front" aria-pressed="false">Front</button>
            <button data-view="left" aria-pressed="false">Left</button>
            <button data-view="right" aria-pressed="false">Right</button>
            <button data-view="rear" aria-pressed="false">Rear</button>
            <button data-view="top" aria-pressed="false">Top</button>
          </nav>
        </div>
      </header>

      <aside class="panel" aria-label="Device parts">
        <button
          class="menu-toggle"
          id="toggle-parts"
          type="button"
          aria-expanded="false"
          aria-controls="parts-menu"
          aria-label="Show parts"
          data-close-label="Hide parts"
        >
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m8 4 6 6-6 6" />
          </svg>
        </button>
        <div class="panel-body" id="parts-menu">
        <section class="detail" id="detail" hidden>
          <div class="detail-top">
            <h2 id="detail-title"></h2>
            <button class="back" id="back" type="button">Overview</button>
          </div>
          <p id="detail-description"></p>
        </section>
        <label class="search">
          <span class="sr-only">Search device parts</span>
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="8" cy="8" r="5.5" />
            <path d="m12 12 5 5" />
          </svg>
          <input id="search-parts" type="search" placeholder="Search" autocomplete="off" />
        </label>
        <div class="filters" aria-label="Filter parts">
          <button data-filter="all" aria-pressed="true">All</button>
          <button data-filter="Front" aria-pressed="false">Front</button>
          <button data-filter="Sides" aria-pressed="false">Sides</button>
          <button data-filter="TopRear" aria-pressed="false">Top</button>
        </div>
        <ul class="parts-list" id="parts-list"></ul>
        </div>
      </aside>

      <div class="dock">
        <div class="scenes" role="radiogroup" aria-label="Background">
          <button type="button" data-scene="studio" aria-pressed="true" title="Studio">
            <span class="swatch swatch-studio"></span>
            <span class="sr-only">Studio</span>
          </button>
          <button type="button" data-scene="sunset" aria-pressed="false" title="Sunset. Move to shift the sun.">
            <span class="swatch swatch-sunset"></span>
            <span class="sr-only">Sunset</span>
          </button>
          <button type="button" data-scene="arcade" aria-pressed="false" title="Arcade. Move to shift the grid.">
            <span class="swatch swatch-arcade"></span>
            <span class="sr-only">Arcade</span>
          </button>
          <button type="button" data-scene="stars" aria-pressed="false" title="Stars. Move to drift the sky.">
            <span class="swatch swatch-stars"></span>
            <span class="sr-only">Stars</span>
          </button>
          <button type="button" data-scene="bubbles" aria-pressed="false" title="Bubbles. Move to push them.">
            <span class="swatch swatch-bubbles"></span>
            <span class="sr-only">Bubbles</span>
          </button>
          <button type="button" data-scene="confetti" aria-pressed="false" title="Confetti. Move to change the wind.">
            <span class="swatch swatch-confetti"></span>
            <span class="sr-only">Confetti</span>
          </button>
        </div>
        <div class="dock-main">
        <div class="tool-row">
          <button class="tool" id="reset" type="button" aria-label="Reset view" title="Reset view (R)">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M4 7a7 7 0 1 1-1 5M4 2v5h5" />
            </svg>
          </button>
          <button class="tool" id="auto-rotate" type="button" aria-pressed="false" title="Toggle automatic rotation">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="m8 5 8 5-8 5Z" />
            </svg>
            <span class="sr-only">Rotate</span>
          </button>
          <button class="tool" id="toggle-labels" type="button" aria-pressed="false" title="Show or hide part labels (L)">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M3 3h7l7 7-7 7-7-7Z" />
              <circle cx="7" cy="7" r="1" />
            </svg>
            <span class="sr-only">Labels</span>
          </button>
          <button class="tool" id="toggle-screen" type="button" aria-pressed="true" title="Turn the display on or off">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="2" y="4" width="16" height="11" rx="2" />
              <path d="M7 18h6M10 15v3" />
            </svg>
            <span class="sr-only">Screen on</span>
          </button>
          <button class="tool" id="toggle-sound" type="button" aria-pressed="false" title="Mute sound (M)">
            <svg class="sound-on" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3.5 8h2.2L10 4.2v11.6L5.7 12H3.5A1.2 1.2 0 0 1 2.3 10.8V9.2A1.2 1.2 0 0 1 3.5 8Z" />
              <path d="M13 7.2a3.6 3.6 0 0 1 0 5.6" />
              <path d="M14.8 5.2a6.2 6.2 0 0 1 0 9.6" />
            </svg>
            <svg class="sound-off" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" hidden>
              <path d="M3.5 8h2.2L10 4.2v11.6L5.7 12H3.5A1.2 1.2 0 0 1 2.3 10.8V9.2A1.2 1.2 0 0 1 3.5 8Z" />
              <path d="m13.2 8 4.2 4.2M17.4 8l-4.2 4.2" />
            </svg>
            <span class="sr-only">Mute</span>
          </button>
          <label class="color-tool" title="Change device color">
            <span class="sr-only">Change device color</span>
            <input id="body-color" type="color" value="#d65c7d" />
          </label>
        </div>
        <div class="zoom-buttons">
          <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in (+)">+</button>
          <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out (−)">−</button>
        </div>
        </div>
      </div>
    </main>
    <div id="announcer" class="sr-only" aria-live="polite"></div>
    <div
      class="rotate-gate"
      id="rotate-gate"
      tabindex="-1"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="rotate-title"
      aria-describedby="rotate-copy"
    >
      <div class="rotate-card">
        <div class="rotate-demo" aria-hidden="true">
          <span class="rotate-target"></span>
          <svg class="rotate-arrow" viewBox="0 0 180 180">
            <path class="rotate-arc-track" d="M61 35 A62 62 0 0 1 152 90" />
            <path class="rotate-arc" pathLength="100" d="M61 35 A62 62 0 0 1 152 90" />
            <path class="rotate-head" d="M145 78 L152 90 L159 78" />
          </svg>
          <div class="rotate-handset">
            <span class="rotate-glass"></span>
            <span class="rotate-home"></span>
          </div>
        </div>
        <h1 id="rotate-title">Rotate to landscape</h1>
        <p id="rotate-copy">Turn your phone sideways.</p>
      </div>
    </div>
    <noscript>
      <p class="noscript">Enable JavaScript to view the 3D device.</p>
    </noscript>
    <script src="js/three-bundle.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
